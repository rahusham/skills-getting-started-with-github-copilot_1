<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delhi Public School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="header-content">
        <div class="header-title">
          <h1>Delhi Public School</h1>
          <h2>Extracurricular Activities</h2>
        </div>
        <img
          class="school-picture"
          src="school.svg"
          alt="Illustration of a school building"
        />
      </div>
    </header>

    <div class="welcome-banner" aria-label="Welcome to our school">
      <p>Welcome to our school!</p>
    </div>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <aside class="principal-message" aria-labelledby="principal-message-title">
      <h3 id="principal-message-title">Principal's Message</h3>
      <p>Hello Parents</p>
    </aside>

    <footer>
      <p>&copy; 2023 Delhi Public School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
